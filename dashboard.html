<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FishMar | Dashboard</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div>
        <h1>🐟 FishMar Admin</h1>
        <p>Control total del negocio</p>
      </div>
      <button class="ghost-btn" onclick="logout()">Cerrar sesión</button>
    </div>
  </header>

  <main class="container dashboard">

    <section class="stats-grid">
      <div class="stat-card">
        <h4>Pedidos hoy</h4>
        <p id="statPedidos">0</p>
      </div>
      <div class="stat-card">
        <h4>Ingresos</h4>
        <p id="statIngresos">$0.00</p>
      </div>
      <div class="stat-card">
        <h4>En proceso</h4>
        <p id="statProceso">0</p>
      </div>
      <div class="stat-card">
        <h4>Entregados</h4>
        <p id="statEntregados">0</p>
      </div>
    </section>

    <section class="dashboard-grid">

      <div class="panel pedidos-panel">
        <div class="panel-header">
          <h2>Pedidos</h2>

          <div class="toolbar">
            <select id="filtroEstado" onchange="cargarPedidos()">
              <option value="Todos">Todos</option>
              <option value="Recibido">Recibido</option>
              <option value="En proceso">En proceso</option>
              <option value="El repartidor está en camino">En camino</option>
              <option value="Entregado">Entregado</option>
            </select>

            <input id="filtroFecha" type="date" onchange="cargarPedidos()" />

            <button class="primary-btn" onclick="ponerHoy()">Hoy</button>
            <button class="secondary-btn" onclick="cerrarDia()">Cerrar día</button>
          </div>
        </div>

        <div id="pedidos" class="admin-list"></div>
      </div>

      <div class="panel chart-panel">
        <h2>Pedidos por estado</h2>
        <canvas id="graficaPedidos"></canvas>
      </div>

      <div class="panel productos-panel">
        <h2>Productos</h2>
        <div id="productosAdmin" class="admin-list"></div>
      </div>


      <div class="panel form-panel">
      <h2>Nuevo producto</h2>

      <input id="nombre" type="text" placeholder="Nombre" />
      <input id="precio" type="number" placeholder="Precio" />
      <select id="categoria" onchange="toggleSubcategoria()">
        <option>Pescadería</option>
        <option>Marisquería</option>
      </select>

      <!-- Campo subcategoría, oculto por defecto -->
      <div id="subcategoriaDiv" style="display: none;">
        <select id="subcategoria">
          <option value="">Selecciona subcategoría</option>
          <option value="Antojitos">Antojitos</option>
          <option value="Mojarras">Mojarras</option>
          <option value="Cocteles">Cocteles</option>
          <option value="Filetes">Filetes</option>
          <option value="Sushi y Onigiri">Sushi y Onigiri</option>
          <option value="Camarones">Camarones</option>
          <option value="Tostadas">Tostadas</option>
          <option value="Ensaladas y Papas">Ensaladas y Papas</option>
          <option value="Postres">Postres</option>
          <option value="Paquetes para Compartir">Paquetes para Compartir</option>
          <option value="Bebidas">Bebidas</option>
        </select>
      </div>

      <input id="descripcion" type="text" placeholder="Descripción del producto" />
      <select id="tipoVenta">
        <option value="pieza">Venta por pieza</option>
        <option value="granel">Venta por kg (a granel)</option>
      </select>

      <input id="imagen_url" type="text" placeholder="URL imagen" />

      <div class="img-preview">
        <img id="previewImg" src="" alt="Vista previa" />
      </div>

      <button class="primary-btn" onclick="crearProducto()">Guardar</button>
      <button class="secondary-btn" onclick="limpiarFormulario()">Limpiar</button>
    </div>

    <script>
    function toggleSubcategoria() {
      const categoria = document.getElementById("categoria").value;
      const subDiv = document.getElementById("subcategoriaDiv");
      if (categoria === "Marisquería") {
        subDiv.style.display = "block";
      } else {
        subDiv.style.display = "none";
      }
    }
    </script>

  <button class="primary-btn" onclick="crearProducto()">Guardar</button>
  <button class="secondary-btn" onclick="limpiarFormulario()">Limpiar</button>
</div>


      <div class="panel full-width">
        <h2>Resumen por repartidor</h2>
        <div id="resumenRepartidores" class="admin-list"></div>
      </div>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
